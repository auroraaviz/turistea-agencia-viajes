<!DOCTYPE html>
<html lang="es">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/register.css">
    <title>Registro</title>
</head>

<body>

<div class="container-fluid p-0">
    <div class="row no-gutters">

        <div class="col-lg-8 bg-turistea panel-izquierdo d-none d-lg-block"></div>

        <div class="col-12 col-lg-4 bg-white panel-derecho d-flex flex-column p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <img src="../assets/img/Turistea_Logo/logo_turistea.svg" alt="Turistea" height="150">
            </div>

            <p class="text-muted mb-4">
                Introduce tus datos a continuación para crear tu cuenta
            </p>

            <!-- FORMULARIO -->
            <form id="formRegistro">

                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre"><strong>Nombre completo *</strong></label>
                    <input type="text" class="form-control" name="nombre" id="nombre"
                           placeholder="Tu nombre completo" required>
                </div>

                <!-- Apellidos (AÑADIDO) -->
                <div class="form-group">
                    <label for="apellidos"><strong>Apellidos *</strong></label>
                    <input type="text" class="form-control" name="apellidos" id="apellidos"
                           placeholder="Apellido1 Apellido2" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email"><strong>Correo electrónico *</strong></label>
                    <input type="email" class="form-control" name="email" id="email"
                           placeholder="tucorreo@email.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password"><strong>Contraseña *</strong></label>
                    <input type="password" class="form-control" name="password" id="password"
                           placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <!-- Confirmar Password -->
                <div class="form-group">
                    <label for="password2"><strong>Confirmar contraseña *</strong></label>
                    <input type="password" class="form-control" name="password2" id="password2"
                           placeholder="Repite tu contraseña" required>
                </div>

                <!-- Teléfono (AÑADIDO) -->
                <div class="form-group">
                    <label for="telefono"><strong>Teléfono *</strong></label>
                    <input type="tel" class="form-control" name="telefono" id="telefono"
                           placeholder="+34 600000000" required>
                </div>

                <!-- Botón correcto -->
                <button type="submit" class="btn button btn-turistea btn-block btn-lg rounded-pill mt-2">
                    Continuar

                </button>

            </form>

            <p class="text-center mt-3">
                ¿Ya tienes cuenta?
                <a href="./login.html" class="font-weight-bold" style="color: #0077B6;">
                    Iniciar sesión
                </a>
            </p>

            <p class="text-muted text-center mt-auto" style="font-size:12px;">
                Al continuar, aceptas los términos y la política de privacidad de Turistea
            </p>

        </div>
    </div>
</div>

<script type="module" src="../js/auth/register.js"></script>
<script type="module" src="../js/auth/keyboardShortcuts.js"></script>
</body>
</html>
