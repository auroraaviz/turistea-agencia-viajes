<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/register.css">

</head>

<body>

    <!-- ocupa el ancho, sin padding, sin separación entre column -->
    <div class="container-fluid p-0">
        <div class="row no-gutters">

            <!-- Panel izq azúl marino - pantallas grandes, ocupa 5 column, se oculta en pant pequeñas -->
            <div class="col-lg-8 bg-turistea panel-izquierdo d-none d-lg-block"> </div>

            <!-- Panel dcho con el formulario, en movil ocupa el ancho, y en grandes ocupa 7, fondo blanco, elem hijos colocados en columna, padding 4 moviles y 5 para medianas o mayores -->
            <div class="col-12 col-lg-4 bg-white panel-derecho d-flex flex-column p-4 p-md-5">

                <!-- Cabecera: logo + botón volver -->
                <!--flexbox para alinear elem, separa logo a la izq y botón a la dcha, centrados y con margen inf -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <img src="../assets/img/Turistea_Logo/1.png" alt="Turistea" height="150">
                    <!-- Botón bootstrap -->
                    <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <!--Título, en negrita,  con margen inf pequeño-->
                <h3 class="font-weight-bold titulo-login mb-1"> Bienvenido de nuevo </h3>
                <!-- texto en gris con margen inferior -->
                <p class="text-muted mb-4"> Inicia sesión con tu cuenta de Turistea </p>

                <!-- Formulario de login -->
                <form id="formLogin">

                    <div class="form-group">
                        <label for="username"> <strong> Correo electrónico </strong></label>
                        <input type="email" class="form-control" name="email" id="email"
                            placeholder="Tu correo electrónico" required>
                    </div>

                    <div class="form-group">
                        <label for="password"> <strong> Contraseña </strong></label>
                        <input type="password" class="form-control" name="password" id="password"
                            placeholder="Tu contraseña" required>
                    </div>

                    <p class="text-right">
                        <a href="#" style="color:#0077B6; font-size:14px;">
                            ¿Has olvidado tu contraseña?
                        </a>
                    </p>

                    <!-- Botón principal, grande, ancho complet, bordes redondeados y margen superior-->
                    <button type="submit" class="btn btn-turistea btn-block btn-lg rounded-pill mt-2">
                        Entrar
                    </button>

                </form>

                <!-- Enlace a registro, centrado con margen superior -->
                <p class="text-center mt-3">
                    ¿No tienes cuenta?
                    <a href="register.html" class="font-weight-bold" style="color:#0077B6;">
                        Crear cuenta
                    </a>
                </p>

                <!-- Texto legal, gris suave, centrado horizontalm, margin top auto-->
                <p class="text-muted text-center mt-auto" style="font-size: 12px;">
                    Al continuar, aceptas los términos y la política de privacidad de Turistea
                </p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.js"></script>
    <script src="../js/utils/ajax.js"></script>
    <script src="../js/auth/login.js"></script>

</body>

</html>
