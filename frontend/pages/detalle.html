<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destalle</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/detalle.css" />
    <script src="../js/utils/fetch.js"></script>
  </head>
  <body>
    Selecciona Paquete
    <select name="" id="paqueteSelect">
      <option value="1">Paquete 1</option>
      <option value="2">Paquete 2</option>
    </select>

    <div class="container mt-4" id="container"></div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const respuesta = await obtener();

        if (respuesta && respuesta.ok) {
          let container = document.getElementById('container');
          const select = document.getElementById('paqueteSelect');

          function pintarPaquete(idSeleccionado) {
            const paquete = respuesta.data.find((p) => p.id == idSeleccionado);

            if (!paquete) {
              container.innerHTML = '<p> No se encontró el paquete. </p>';
              return;
            }

            container.innerHTML = `
  <div class="container-xl mt-4">

    <div class="mb-4">
      <h2>A destacar</h2>
      <div class="row">
        <div class="col-12 col-md-6">
          <i class="bi bi-airplane-fill text-primary me-2"></i>
          Vuelos incluidos:
          <b>${paquete.vuelo_incluido ? 'Sí' : 'No'}</b>
          ${paquete.vuelo_incluido ? `<br>Salida desde: <b>${paquete.salida_desde}</b>` : ''}
        </div>

        <div class="col-12 col-md-6">
          ${paquete.cerca_playa ? `
            <i class="bi bi-brightness-high-fill text-warning me-2"></i>
            Cerca de la playa
          ` : ''}
        </div>
      </div>
    </div>

    <hr>

    <h2>Detalles de la oferta</h2>
    <p>
      <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
      Turistea no se hace responsable de retrasos y cancelaciones en los vuelos
    </p>

    <h3 class="mt-3">${paquete.titulo}</h3>
    <p class="text-muted">${paquete.destino}</p>

    <div class="fondo p-3 rounded mt-4">
      <div class="row align-items-center">
        <div class="col-12 col-md-4">
          <img
            src="${paquete.imagen}"
            alt="${paquete.titulo}"
            class="img-fluid rounded"
          >
        </div>

        <div class="bg-light col-12 col-md-8 p-3">
          <h4 class="mb-1">${paquete.hotel_nombre}</h4>
          <p class="mb-1 fuente_peq">${paquete.hotel_estrellas} estrellas</p>
          <ul class="mb-1 fuente_peq ps-3">
            <li class="mb-0">Equipaje de mano incluido</li>
            <li class="mb-0">Añade traslado al aeropuerto más tarde</li>
          </ul>
          <p class="mb-1 fuente_peq "><strong>Régimen:</strong> ${paquete.hotel_regimen}</p>
          <p class="mb-1 fuente_peq"><strong>Salida:</strong> ${paquete.fecha_salida}</p>
          <p class="mb-1 fuente_peq"><strong>Regreso:</strong> ${paquete.fecha_regreso}</p>
          <p class="mb-1 fuente_peq"><strong>Plazas disponibles:</strong> ${paquete.plazas_disponibles} / ${paquete.plazas_totales}</p>
          <h4 class="mb-1"><strong></strong> ${paquete.precio}€</h4>
          <p class="mb-0 fuente_peq">precio por pers. </p>
          <p class="mb-1 fuente_peq"><strong>Descuento:</strong> ${paquete.descuento}%</p>
        </div>
      </div>

      <div class="mt-0">
        <i class="bi bi-link-45deg"></i>
        <a href="#" class="text-decoration-none">Ir a la oferta</a>
      </div>
    </div>
    <p class="mt-3">🪙 Precio y disponibilidad a fecha de publicación. Pueden cambiar.  </p>
    <hr>

    <p>✅ Las fechas no se pueden modificar</p>
    <p>✅ El precio es la suma de vuelo + hotel</p>

    <h5>
      ¿Tienes dudas o prefieres reservar por teléfono?
      Puedes llamar al 987654321 de lunes a viernes de 9h a 18h
    </h5>

    <hr>

    <div class="mt-3">
      <h3>🏨 ¿Dónde te alojarás?</h3>
      <p>En esta ocasión hemos escogido <strong>${paquete.hotel_nombre}</strong>.</p>
    </div>

    <div class="mt-3">
      <h3>${paquete.hotel_nombre}</h3>
      <img
        src="${paquete.hotel_imagen}"
        alt="${paquete.hotel_nombre}"
        class="img-fluid rounded"
      >
    </div>

  </div>
`;
          }

          pintarPaquete(select.value);

          select.addEventListener('change', function () {
            pintarPaquete(this.value);
          });
        } else {
          console.error('Error al cargar JSON');
        }
      });
    </script>
  </body>
</html>
