<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del paquete - Turistea</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/detalle.css" />
    <script src="../js/utils/fetch.js"></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary shadow-sm py-0">
      <div class="container">
        <a class="navbar-brand" href="../../index.html">
          <img src="../assets/img/Turistea_Logo/logo_turistea.png" width="90" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="../../index.html"><i class="bi bi-house fs-3"></i></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-5" id="detalle-container">
      <!-- Spinner de carga -->
      <div class="text-center py-5" id="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Error -->
      <div class="alert alert-danger d-none" id="error">
        No se encontr&oacute; el paquete solicitado.
      </div>

      <!-- Detalle del paquete -->
      <div class="d-none" id="detalle">
        <!-- Fila principal: imagen + info -->
        <div class="row align-items-center g-4 mb-4">
          <!-- Imagen -->
          <div class="col-md-5">
            <img id="paquete-imagen" src="" alt="" class="w-100 object-fit-cover rounded-4 shadow" style="max-height: 360px;" />
          </div>

          <!-- Info -->
          <div class="col-md-7">
            <h2 class="text-primary fw-bold fs-2" id="paquete-titulo"></h2>
            <p class="mb-1 text-secondary" id="paquete-destino">
              <i class="bi bi-geo-alt"></i> <span></span>
            </p>
            <p class="fs-6 text-dark mb-1" id="paquete-info-corta"></p>
            <p class="fw-bold text-primary mb-3" id="paquete-precio"></p>

            <div id="paquete-badges" class="mb-3"></div>

            <div class="d-flex align-items-center gap-3">
              <a href="#" class="btn btn-info text-white rounded-pill px-4 py-2 fw-semibold" id="btn-reservar">
                Reservar
              </a>
              <button class="btn btn-link text-danger fs-3 p-0 border-0" id="btn-favorito" title="Favorito">
                <i class="bi bi-heart"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Descripcion completa -->
        <div class="mb-5">
          <p class="text-secondary small lh-lg" id="paquete-descripcion"></p>
          <p class="text-secondary small lh-lg" id="paquete-detalles-extra"></p>
        </div>

        <!-- Barra footer decorativa -->
        <div class="bg-primary rounded-3" style="height: 50px;"></div>
      </div>
    </div>
    Selecciona Paquete
    <select name="" id="paqueteSelect">
      <option value="1">Paquete 1</option>
      <option value="2">Paquete 2</option>
    </select>

    <div class="container mt-4" id="container"></div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const respuesta = await obtener();

        if (respuesta && respuesta.ok) {
          let container = document.getElementById('container');
          const select = document.getElementById('paqueteSelect');

          function pintarPaquete(idSeleccionado) {
            const paquete = respuesta.data.find((p) => p.id == idSeleccionado);

            if (!paquete) {
              container.innerHTML = '<p> No se encontró el paquete. </p>';
              return;
            }

            container.innerHTML = `
  <div class="container-xl mt-4">

    <div class="mb-4">
      <h2>A destacar</h2>
      <div class="row">
        <div class="col-12 col-md-6">
          <i class="bi bi-airplane-fill text-primary me-2"></i>
          Vuelos incluidos:
          <b>${paquete.vuelo_incluido ? 'Sí' : 'No'}</b>
          ${paquete.vuelo_incluido ? `<br>Salida desde: <b>${paquete.salida_desde}</b>` : ''}
        </div>

        <div class="col-12 col-md-6">
          ${paquete.cerca_playa ? `
            <i class="bi bi-brightness-high-fill text-warning me-2"></i>
            Cerca de la playa
          ` : ''}
        </div>
      </div>
    </div>

    <hr>

    <h2>Detalles de la oferta</h2>
    <p>
      <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
      Turistea no se hace responsable de retrasos y cancelaciones en los vuelos
    </p>

    <h3 class="mt-3">${paquete.titulo}</h3>
    <p class="text-muted">${paquete.destino}</p>

    <div class="fondo p-3 rounded mt-4">
      <div class="row align-items-center">
        <div class="col-12 col-md-4">
          <img
            src="${paquete.imagen}"
            alt="${paquete.titulo}"
            class="img-fluid rounded"
          >
        </div>

        <div class="bg-light col-12 col-md-8 p-3">
          <h4 class="mb-1">${paquete.hotel_nombre}</h4>
          <p class="mb-1 fuente_peq">${paquete.hotel_estrellas} estrellas</p>
          <ul class="mb-1 fuente_peq ps-3">
            <li class="mb-0">Equipaje de mano incluido</li>
            <li class="mb-0">Añade traslado al aeropuerto más tarde</li>
          </ul>
          <p class="mb-1 fuente_peq "><strong>Régimen:</strong> ${paquete.hotel_regimen}</p>
          <p class="mb-1 fuente_peq"><strong>Salida:</strong> ${paquete.fecha_salida}</p>
          <p class="mb-1 fuente_peq"><strong>Regreso:</strong> ${paquete.fecha_regreso}</p>
          <p class="mb-1 fuente_peq"><strong>Plazas disponibles:</strong> ${paquete.plazas_disponibles} / ${paquete.plazas_totales}</p>
          <h4 class="mb-1"><strong></strong> ${paquete.precio}€</h4>
          <p class="mb-0 fuente_peq">precio por pers. </p>
          <p class="mb-1 fuente_peq"><strong>Descuento:</strong> ${paquete.descuento}%</p>
        </div>
      </div>

      <div class="mt-0">
        <i class="bi bi-link-45deg"></i>
        <a href="#" class="text-decoration-none">Ir a la oferta</a>
      </div>
    </div>
    <p class="mt-3">🪙 Precio y disponibilidad a fecha de publicación. Pueden cambiar.  </p>
    <hr>

    <p>✅ Las fechas no se pueden modificar</p>
    <p>✅ El precio es la suma de vuelo + hotel</p>

    <h5>
      ¿Tienes dudas o prefieres reservar por teléfono?
      Puedes llamar al 987654321 de lunes a viernes de 9h a 18h
    </h5>

    <hr>

    <div class="mt-3">
      <h3>🏨 ¿Dónde te alojarás?</h3>
      <p>En esta ocasión hemos escogido <strong>${paquete.hotel_nombre}</strong>.</p>
    </div>

    <div class="mt-3">
      <h3>${paquete.hotel_nombre}</h3>
      <img
        src="${paquete.hotel_imagen}"
        alt="${paquete.hotel_nombre}"
        class="img-fluid rounded"
      >
    </div>

  </div>
`;
          }

          pintarPaquete(select.value);

          select.addEventListener('change', function () {
            pintarPaquete(this.value);
          });
        } else {
          console.error('Error al cargar JSON');
        }
      });
    </script>
    <title>Detalle del paquete - Turistea</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <style>
      .paquete-imagen {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      }

      .paquete-titulo {
        color: #0077b6;
        font-weight: 800;
        font-size: 2rem;
      }

      .paquete-precio {
        font-size: 1.1rem;
        color: #333;
      }

      .btn-reservar {
        background-color: #00b4d8;
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 10px 36px;
        font-weight: 600;
        font-size: 1rem;
        transition: background-color 0.3s ease;
      }

      .btn-reservar:hover {
        background-color: #0096c7;
        color: #fff;
      }

      .btn-favorito {
        background: none;
        border: none;
        font-size: 1.8rem;
        color: #e63946;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .btn-favorito:hover {
        transform: scale(1.2);
      }

      .descripcion-completa {
        color: #444;
        font-size: 0.95rem;
        line-height: 1.7;
      }

      .footer-bar {
        background-color: #0077b6;
        height: 50px;
        border-radius: 12px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary shadow-sm py-0">
      <div class="container">
        <a class="navbar-brand" href="../../index.html">
          <img src="../assets/img/Turistea_Logo/logo_turistea.png" width="90" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="../../index.html"><i class="bi bi-house fs-3"></i></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-5" id="detalle-container">
      <!-- Spinner de carga -->
      <div class="text-center py-5" id="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Error -->
      <div class="alert alert-danger d-none" id="error">
        No se encontr&oacute; el paquete solicitado.
      </div>

      <!-- Detalle del paquete -->
      <div class="d-none" id="detalle">
        <!-- Fila principal: imagen + info -->
        <div class="row align-items-center g-4 mb-4">
          <!-- Imagen -->
          <div class="col-md-5">
            <img id="paquete-imagen" src="" alt="" class="paquete-imagen" />
          </div>

          <!-- Info -->
          <div class="col-md-7">
            <h2 class="paquete-titulo" id="paquete-titulo"></h2>
            <p class="mb-1" id="paquete-destino" style="color: #555;">
              <i class="bi bi-geo-alt"></i> <span></span>
            </p>
            <p class="paquete-precio mb-1" id="paquete-info-corta"></p>
            <p class="fw-bold mb-3" style="color: #0077b6;" id="paquete-precio"></p>

            <div id="paquete-badges" class="mb-3"></div>

            <div class="d-flex align-items-center gap-3">
              <a href="#" class="btn btn-reservar" id="btn-reservar">
                Reservar
              </a>
              <button class="btn-favorito" id="btn-favorito" title="Favorito">
                <i class="bi bi-heart"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Descripcion completa -->
        <div class="mb-5">
          <p class="descripcion-completa" id="paquete-descripcion"></p>
          <p class="descripcion-completa" id="paquete-detalles-extra"></p>
        </div>

        <!-- Barra footer decorativa -->
        <div class="footer-bar"></div>
      </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/paquetes/detalle.js"></script>
  </body>
</html>
