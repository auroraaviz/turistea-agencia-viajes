<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del paquete - Turistea</title>

    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/detalle.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary shadow-sm py-0">
      <div class="container">
        <a class="navbar-brand" href="../../index.html">
          <img src="../assets/img/Turistea_Logo/logo_turistea.png" width="90" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="../../index.html">
                <i class="bi bi-house fs-3"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-5" id="detalle-container">
      <!-- Spinner -->
      <div class="text-center py-5" id="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <!-- Error -->
      <div class="alert alert-danger d-none" id="error">
        No se encontró el paquete solicitado.
      </div>

      <!-- Cabecera detalle -->
      <div class="d-none" id="detalle">
        <div class="row align-items-center g-4 mb-4">
          <div class="col-md-5">
            <img
              id="paquete-imagen"
              src=""
              alt=""
              class="w-100 object-fit-cover rounded-4 shadow"
              style="max-height: 360px;"
            />
          </div>

          <div class="col-md-7">
            <h2 class="text-primary fw-bold fs-2" id="paquete-titulo"></h2>

            <p class="mb-1 text-secondary" id="paquete-destino">
              <i class="bi bi-geo-alt"></i> <span></span>
            </p>

            <p class="fs-6 text-dark mb-1" id="paquete-info-corta"></p>
            <p class="fw-bold text-primary mb-3" id="paquete-precio"></p>

            <div id="paquete-badges" class="mb-3"></div>

            <div class="d-flex align-items-center gap-3">
              <a
                href="#"
                class="btn btn-info text-white rounded-pill px-4 py-2 fw-semibold"
                id="btn-reservar"
              >
                Reservar
              </a>

              <button
                class="btn btn-link text-danger fs-3 p-0 border-0"
                id="btn-favorito"
                title="Favorito"
              >
                <i class="bi bi-heart"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="mb-5">
          <p class="text-secondary small lh-lg" id="paquete-descripcion"></p>
          <p class="text-secondary small lh-lg" id="paquete-detalles-extra"></p>
        </div>

        <div class="bg-primary rounded-3" style="height: 50px;"></div>
      </div>
    </div>

    <!-- Contenido extra -->
    <div class="container mt-4" id="container"></div>

  

    <script type="module">
      import { obtener } from "../js/utils/fetch.js";

      document.addEventListener("DOMContentLoaded", async function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          document.getElementById("loading").classList.add("d-none");
          document.getElementById("error").classList.remove("d-none");
          return;
        }

        const respuesta = await obtener("/turistea/JR_M26_AgenciaViajes/api/paquetes/get.php");

        if (!respuesta) {
          document.getElementById("loading").classList.add("d-none");
          document.getElementById("error").classList.remove("d-none");
          return;
        }

        const container = document.getElementById("container");
        const paquete = respuesta.find((p) => p.id == id);

        if (!paquete) {
          document.getElementById("loading").classList.add("d-none");
          document.getElementById("error").classList.remove("d-none");
          return;
        }

        // Cabecera
        document.getElementById("paquete-imagen").src = paquete.imagen;
        document.getElementById("paquete-imagen").alt = paquete.titulo;
        document.getElementById("paquete-titulo").textContent = paquete.titulo;
        document.getElementById("paquete-destino").querySelector("span").textContent = paquete.destino;
        document.getElementById("paquete-info-corta").textContent =
          paquete.fecha_salida +
          " - " +
          paquete.fecha_regreso +
          " · " +
          paquete.plazas_disponibles +
          " plazas disponibles";
        document.getElementById("paquete-precio").textContent = paquete.precio + "€";
        document.getElementById("paquete-descripcion").textContent = paquete.descripcion;

        // Badges
        const badges = document.getElementById("paquete-badges");
        badges.innerHTML = `
          ${paquete.vuelo_incluido == 1 ? '<span class="badge bg-primary me-2">Vuelo incluido</span>' : ""}
          ${paquete.cerca_playa == 1 ? '<span class="badge bg-warning text-dark">Cerca de la playa</span>' : ""}
        `;

        document.getElementById("loading").classList.add("d-none");
        document.getElementById("detalle").classList.remove("d-none");

        // Contenido extra
        container.innerHTML = `
          
            <div class="mb-4">
              <h2>A destacar</h2>
              <div class="row">
                <div class="col-12 col-md-6">
                  <i class="bi bi-airplane-fill text-primary me-2"></i>
                  Vuelos incluidos:
                  <b>${paquete.vuelo_incluido == 1 ? "Sí" : "No"}</b>
                  ${
                    paquete.vuelo_incluido == 1
                      ? `<br>Salida desde: <b>${paquete.salida_desde}</b>`
                      : ""
                  }
                </div>

                <div class="col-12 col-md-6">
                  ${
                    paquete.cerca_playa == 1
                      ? `
                        <i class="bi bi-brightness-high-fill text-warning me-2"></i>
                        Cerca de la playa
                      `
                      : ""
                  }
                </div>
              </div>
            </div>

            <hr>

            <h2>Detalles de la oferta</h2>
            <p>
              <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
              Turistea no se hace responsable de retrasos y cancelaciones en los vuelos
            </p>


<!-- Hotel + precio -->
            <div class="container fondo p-4">
              <div class="row-cols-3 bg-light d-flex rounded-2">   
                  <div class="p-0">
                  <img src="${paquete.hotel_imagen}" alt="${paquete.titulo}" class="img-fluid w-100 rounded">
                </div>
                
              <div class=" align-items-center rounded p-2">
                <div >                  
                  <h4 class="mb-1 text-center estrellas mt-2">${paquete.hotel_nombre} </h4>
                  <p class="text-center estrellas">${"★".repeat(paquete.hotel_estrellas || 0)}</p>
                  <ul class="mb-1 fuente_peq lista-check">
                    <li class="mb-0"> Equipaje de mano incluido</li>
                    <li class="mb-0"> Añade traslado al aeropuerto más tarde</li>
                  </ul>
                  <p class="fuente_peq text-center"><strong>Régimen:</strong> ${paquete.hotel_regimen}</p>
                </div>
                
                </div> 
                  <div class=" align-content-center">
                    <div class="row row-cols-2 fuente_peq"> 
                    <div><strong>Salida:</strong> ${paquete.fecha_salida}</div> 
                    <div><strong>Regreso:</strong> ${paquete.fecha_regreso}</div> 
                </div>
                   
                  <p class="fuente_peq m-0">Precio final paquete completo:</p>
                  <h4 class="mb-1">${paquete.precio}€</h4>
                  <p class="mb-0 fuente_peq">precio por persona</p>
                  <p class="mb-1 fuente_peq"><strong>Descuento:</strong> ${paquete.descuento} %</p>
                   <p class="mb-1 fuente_peq"><strong>Plazas disponibles:</strong> ${paquete.plazas_disponibles} / ${paquete.plazas_totales}</p>
                </div>
              </div>
              </div>

              <div class="mt-3">
                <i class="bi bi-link-45deg"></i>
                <a href="#" class="text-decoration-none">Ir a la oferta</a>
              </div>

            </div>
            </div>

<!-- fin hotel + oferta -->

            <p class="mt-3">🪙 Precio y disponibilidad a fecha de publicación. Pueden cambiar.</p>

            <hr>

            <p>✅ Las fechas no se pueden modificar</p>
            <p>✅ El precio es la suma de vuelo + hotel</p>

            <h5>
              ¿Tienes dudas o prefieres reservar por teléfono?
              Puedes llamar al 987654321 de lunes a viernes de 9h a 18h
            </h5>

            <hr>

            <div class="mt-3">
              <h3>🏨 ¿Dónde te alojarás?</h3>
              <p>En esta ocasión hemos escogido <strong>${paquete.hotel_nombre}</strong>.</p>
            </div>

            <div class="mt-3">
              <h3>${paquete.hotel_nombre}</h3>
              <img
                src="${paquete.hotel_imagen}"
                alt="${paquete.hotel_nombre}"
                class="img-fluid rounded"
              >
            </div>
          
        `;
      });
    </script>
  </body>
</html>
