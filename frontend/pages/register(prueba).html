<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .formulario {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: antiquewhite;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      label {
        font-size: 1.2em;
      }

      input {
        width: 400px;
        padding: 10px;
        font-size: 1.1em;
        text-align: center;
      }
      form {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}
.button{
    border-radius: 25px;
    background-color: rgb(96, 104, 101);
    color: white;
    width: 100%;
}

    </style>
    
  </head>
  <body>
    <div class="formulario">
      <form id="formRegistro" >
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required />

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" placeholder="Apellido1 Apellido2" required/>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@ejemplo.com" required/>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>

        <label for="telefono">Teléfono de contacto</label>
        <input type="text" id="telefono" name="telefono" placeholder="ej +34 123123" required/>

        <input type="submit" class="button"/>
      </form>
    </div>

    <script src="../js/utils/ajax.js"></script>
    <script src="../js/auth/register.js"></script>
  </body>
</html>
